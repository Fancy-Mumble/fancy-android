// The Android host for GPUI programs built with Fancy-Mumble/gpui: a
// NativeActivity (gpui-mobile's GpuiInputActivity, for the input method)
// loading the Rust library named in app/build.gradle. Build output goes to
// each project's own build folder, or under the folder the Gradle property
// `fancyBuildDir` names (`-PfancyBuildDir=...`, or in ~/.gradle/gradle.properties).
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.0' }
}
def fancyBuildDir = findProperty('fancyBuildDir')
if (fancyBuildDir) {
    allprojects { layout.buildDirectory = file("${fancyBuildDir}/${project.name}") }
}
